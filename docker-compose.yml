
services:
  chrome:
    image: seleniarm/standalone-chromium:latest
    container_name: selenium-chrome
    shm_size: '2gb'
    ports:
      - "4444:4444"
      - "7900:7900"
    environment:
      - TZ=Asia/Taipei
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444"]
      interval: 10s
      timeout: 5s
      retries: 3

  court-scraper:
    build: .
    container_name: tennis-court-scraper
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Taipei
      - PYTHONUNBUFFERED=1
      - SELENIUM_REMOTE_URL=http://chrome:4444/wd/hub
    depends_on:
      chrome:
        condition: service_healthy
